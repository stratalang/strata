name: Deploy Docs

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create .vercel folder
        run: |
          mkdir -p .vercel
          echo '{"projectId":"'"${{ secrets.VERCEL_PROJECT_ID }}"'","orgId":"'"${{ secrets.VERCEL_ORG_ID }}"'"}' > .vercel/project.json

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🧪 Creating preview deployment..."
            # Note: We run from the docs directory, but vercel might need to know the root or be configured via vercel.json
            DEPLOY_URL=$(npx vercel --token=$VERCEL_TOKEN --yes --confirm | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1)
            echo "preview_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          else
            echo "🚀 Deploying production build..."
            DEPLOY_URL=$(npx vercel --prod --token=$VERCEL_TOKEN --yes --confirm | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1)
            echo "preview_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          fi

      - name: Comment or update PR with Preview URL
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.preview_url != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ **Vercel Preview Deployment Ready!**
            🔗 [View Preview](${{ steps.deploy.outputs.preview_url }})
          edit-mode: replace
